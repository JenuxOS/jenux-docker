name: build

permissions:
  contents: read

on:
  push:
    branches:
      main
  workflow_dispatch:
  schedule:
   - cron: 4 0 * * *

jobs:
  build:
    
    strategy:
      fail-fast: false
    
    name: build
    runs-on: 'ubuntu-latest'
    timeout-minutes: 240
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Create environment file
        run: |
          cp .env.example .env
          cat >> .env<<EOF
          DOCKERUSERNAME=${{ secrets.DOCKERUSERNAME }}
          DOCKERPAT=${{ secrets.DOCKERPAT }}
          EOF
      - name: Build Docker image
        run: docker build . -t containerbuild

      - name: Run Docker container
        run: |
          docker run \
          --privileged \
          --rm \
          --volume /var/run/docker:/var/run/docker \
          --volume /var/run/docker.sock:/var/run/docker.sock \
          --env-file .env \
          -t containerbuild

